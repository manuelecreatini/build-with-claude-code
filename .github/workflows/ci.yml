name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generated pages match their sources
        run: |
          node scripts/split-playbook.mjs content-source/playbook.en.md en
          node scripts/split-playbook.mjs content-source/playbook.it.md it
          git diff --exit-code -- src/content/docs src/data \
            || { echo "::error::Generated files differ from the split script's output. Edit the source and re-run the split script, then commit both."; exit 1; }

      - name: Content audit (source vs pages, EN vs IT)
        run: npm run audit:content

      - name: Check MDX pages compile
        run: node scripts/check-mdx.mjs

      - name: Type and content-schema check
        run: npm run check

      - name: Build (also validates internal links)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
